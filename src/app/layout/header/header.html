<mat-toolbar class="app-header">
  <button mat-icon-button (click)="toggleSidebar.emit()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="page-title">Cost &amp; Quality Control</span>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
    <mat-icon>account_circle</mat-icon>
    <span>{{ auth.getUser()?.username }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-menu-header" style="padding: 12px 16px; border-bottom: 1px solid #eee; pointer-events: none;">
      <div style="font-weight: 600; font-size: 0.9rem;">{{ auth.getUser()?.username }}</div>
      <div style="font-size: 0.78rem; color: #78909c;">{{ auth.getUser()?.role }}</div>
    </div>
    <button mat-menu-item (click)="openChangePassword()">
      <mat-icon>lock_reset</mat-icon>
      <span>Change Password</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign Out</span>
    </button>
  </mat-menu>
</mat-toolbar>
