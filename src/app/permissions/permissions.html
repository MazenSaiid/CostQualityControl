<div class="page">
  <div class="page-header">
    <div>
      <h2>Role Permissions</h2>
      <p>Control what each role can view, write, and delete per resource</p>
    </div>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="saving() || selectedRole() === 'Admin'">
      <mat-icon>save</mat-icon> Save Permissions
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="role-selector">
        <mat-form-field appearance="outline">
          <mat-label>Select Role</mat-label>
          <mat-select [(ngModel)]="selectedRoleValue" (ngModelChange)="onRoleChange($event)">
            <mat-option *ngFor="let r of roles" [value]="r">{{r}}</mat-option>
          </mat-select>
        </mat-form-field>
        <span class="admin-note" *ngIf="selectedRole() === 'Admin'">
          <mat-icon>lock</mat-icon> Admin always has full access — cannot be restricted
        </span>
      </div>

      <mat-progress-bar *ngIf="saving()" mode="indeterminate"></mat-progress-bar>

      <div class="table-wrap">
      <table mat-table [dataSource]="rows()" class="perms-table">
        <ng-container matColumnDef="resource">
          <th mat-header-cell *matHeaderCellDef>Resource</th>
          <td mat-cell *matCellDef="let row">
            <strong>{{row.resource}}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="canView">
          <th mat-header-cell *matHeaderCellDef>View</th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              [(ngModel)]="row.canView"
              (change)="onViewChange(row)"
              [disabled]="selectedRole() === 'Admin'">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="canWrite">
          <th mat-header-cell *matHeaderCellDef>Write / Edit</th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              [(ngModel)]="row.canWrite"
              (change)="onWriteChange(row)"
              [disabled]="selectedRole() === 'Admin'">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="canDelete">
          <th mat-header-cell *matHeaderCellDef>Delete</th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              [(ngModel)]="row.canDelete"
              (change)="onDeleteChange(row)"
              [disabled]="selectedRole() === 'Admin'">
            </mat-checkbox>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;" class="perm-row"></tr>
      </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
